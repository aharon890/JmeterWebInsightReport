name: CI

# The FAST half of the test estate, and deliberately only that: the Java tests, the
# shaded-JAR guard, a shell syntax check and three cheap consistency guards. About a
# minute and a half in total.
#
# This job was deleted in 4a72faf together with regression.yml, in one decision. The
# evidence behind that decision was specific and measured — a full regression took
# 15m48s on a shared 2-core runner against ~1½ minutes locally, because the scenarios
# are wall-clock bound and a runner cannot overlap them the way a developer machine
# can. Every word of that is about the fixture/browser tier. It says nothing about
# THIS tier, which is 574 unit tests summing to under three seconds of Surefire time
# plus five greps: work that runs at the same speed on any machine. Deleting it was
# collateral, and this restores it.
#
# What it buys: CLAUDE.md states the standing hole plainly — "a push made without
# [the run-tests skill] — any manual `git push` — reaches the remote untested. There
# is no later gate that catches it." For everything that does not need JMeter, a
# fixture or a browser, this closes that hole.
#
# TWO CONDITIONS, so this does not become the thing that decision rejected:
#   1. regression.yml stays deleted. The wall-clock-bound tier runs locally, before
#      the push, via the run-tests skill.
#   2. No required status check slower than this job. CI must never become something
#      people wait on; the pre-push hook keeps its one rule and still runs no tests.
#
# No branch is named, so nothing here breaks if the primary branch is renamed.
on:
  push:
    branches: ['**']
  pull_request:

# Reads the repo, uploads an artifact on failure, nothing else. Stating it means the
# default token cannot push commits or edit issues whatever the repo-wide default is.
permissions:
  contents: read

# A newer push supersedes an in-flight run of the same ref. Grouped by ref so a PR
# and the primary branch never evict each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    # This job takes about a minute and a half. Ten is generous; the point is that a
    # hung download or a test waiting on a socket fails in minutes rather than running
    # to the six-hour default.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # The build targets Java 21 bytecode (maven.compiler.release). 21 matches the
      # JRE in docker/Dockerfile.jmeter and is the minimum JDK that can build it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # `verify` rather than `test`: it also runs the shade plugin, so a broken
      # relocation config fails here rather than at deploy time.
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      # The pure half of report.js, in node, with no browser and no fixture. About a tenth of
      # a second, and machine-independent in exactly the way the wall-clock-bound tiers are not
      # — which is the whole criterion for what belongs in this job.
      - name: report.js unit tests
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          run_js_unit_tests

      # Every bundled third-party class must be relocated under our own package,
      # because the fat JAR lands in JMeter's flat lib/ext classloader and would
      # otherwise collide with another plugin's copy of the same library.
      #
      # This step is worth more here than it is locally. verify_shaded_jar opens with
      # `command -v jar >/dev/null 2>&1 || return 0` — on a machine without the JDK
      # tools on PATH it returns success without checking anything, which is the one
      # failure mode an allowlist must not have. setup-java guarantees `jar`, so the
      # allowlist is actually enforced on every push here even when it silently
      # no-ops on someone's laptop.
      - name: Verify shaded JAR relocations
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          verify_shaded_jar

      # Catches syntax errors in the runners without needing JMeter or Docker. A
      # syntax error is silent in the wild: the next runner cannot start at all.
      - name: Check shell scripts parse
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/*.sh scripts/lib/*.sh test-plans/scripts/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f" || { echo "SYNTAX FAIL: $f" >&2; fail=1; }
          done
          exit $fail

      # A script or hook committed 100644 is not a syntax error and not a test
      # failure — it is a Permission denied at the moment someone follows the
      # documented command, and for a git hook it is worse than that: Linux and
      # macOS skip a non-executable hook SILENTLY, so the gate that was supposed to
      # block the push simply does not run. Windows sets core.filemode=false, so the
      # bit has to be written into the index deliberately and nothing local complains
      # when it is missing. Hence a check that runs where the bit matters.
      #
      # This was an inline block when the workflow was first written, because
      # verify_script_modes did not exist yet. It does now, and the S03/R03 static
      # stage calls it, so CI and the suites check the index the same way.
      - name: Check scripts and hooks are executable
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          verify_script_modes

      # Added since the workflow was deleted, and the check most likely to be
      # violated by a contributor on Windows. `eol=` governs the working tree only;
      # the blob must be LF regardless. A CRLF blob hides behind git's stat cache —
      # the file looks clean until something touches it, and then staging it turns a
      # 158-line change into an 11,566-line diff.
      - name: Check text blobs are LF
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          verify_line_endings

      # A raw NUL makes GNU grep read the rest of a file as binary, so every grep-shaped guard
      # over it goes blind past the byte without saying so. Two pasted into report.js hid four
      # of the Server tab's inline handlers from the jsArg rule below. Ordered before that rule
      # deliberately: the rule's own pass means nothing on a file it could not read.
      - name: Check no text file carries a NUL byte
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          verify_no_nul_bytes

      # Three grep-shaped rules over report.js, each of which would have caught a defect
      # that actually shipped: an inline handler escaping with esc() instead of jsArg(), a
      # chip class assembled by hand, and the asserts table passed to a generic table helper
      # that would erase its own filter on the next render.
      - name: Check the report.js source rules
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          verify_report_js_rules

      # The guardrails get tested like everything else, because these shipped broken:
      # rule 2 of the source rules matched only one quote style, run-goldens.sh --accept
      # exited 0 over a failed regeneration, the deploy reported a stale plugin JAR
      # removed when rm had failed, leaving two on JMeter's classpath, a fixture stamp
      # called a report current that another JAR had rendered, and a fixture
      # regeneration whose JMeter wrote nothing, or whose rm could not remove the old
      # report, passed on the previous cycle's report under a fresh stamp, and the example
      # script read its verdict off a report.css comment and refused nothing. Each self-test
      # replays its defect and demands the guard refuse it. The goldens and
      # failed-regeneration ones run the real runners against
      # a stub JMeter, and the purge, stamp and regeneration ones work in a scratch
      # lib/ext and results directory, so none needs a JMeter install —
      # machine-independent, which is the criterion for this job. The goldens, stamp and
      # regeneration ones read the shaded JAR, which `mvn verify` above has already
      # built. The ones that expect a runner to fail take its status with `|| rc=$?`,
      # because this step runs under errexit.
      - name: Self-test the guardrails
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          selftest_report_js_rules
          selftest_no_nul_bytes
          selftest_goldens_accept
          selftest_jq_idioms
          selftest_purge_old_plugin_jars
          selftest_fixture_stamps
          selftest_failed_regeneration
          selftest_report_gate_verdict

      # The jq a pipeline gates with lives in one file, test-plans/goldens/jq-gate.txt, and every
      # line of it is run over the golden CI/CD documents its CASES line names — G5-G8 among them,
      # server-only runs where the server half alone decides (over G1-G4 a wrong key, a deleted
      # server clause and an inverted failsBuild test all passed). verify_jq_idioms opens with
      # `command -v jq || return 0`, as verify_shaded_jar does with `jar`, so on a laptop without
      # jq it checks nothing; the ubuntu runner has jq, so this is where it is enforced. The
      # idiom it replaced errored on every client-only run and nothing had ever run it.
      - name: Check the documented jq idioms over the goldens
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "jq is missing on the runner" >&2; exit 1; }
          . scripts/lib/common.sh
          verify_jq_idioms

      # The shell and the TypeScript suite each hold a copy of the fixture list. A
      # drift leaves a fixture either generated and never asserted on, or demanded
      # and never generated. Needs no JMeter, no browser and no fixtures, so it
      # belongs in the fast tier.
      - name: Check the two fixture lists agree
        run: |
          set -euo pipefail
          . scripts/lib/common.sh
          verify_fixture_lists

      # Surefire output is the only way to see which assertion failed once the
      # runner is gone.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
