# Settings for both commands, so no -J has to survive a shell. Forward slashes in paths.
# Registers the Web Insight exporter, so reportgenerator.properties needs no edit:
jmeter.reportgenerator.exporter.webinsight.classname=com.jmeterwebinsightreport.report.exporter.WebInsightDataExporter
webinsight.report.annotations=report-annotations.json
webinsight.report.servermetrics=server.csv
# The demo CSV has one row per second:
webinsight.report.servermetrics.step=1s
